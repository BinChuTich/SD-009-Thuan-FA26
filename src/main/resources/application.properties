spring.application.name=SD-009-thuan

# SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=FF_Tshirt;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Database is created by the SQL script, so Hibernate must not recreate/change it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Multipart / image upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload-dir=uploads

# CORS
spring.web.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
